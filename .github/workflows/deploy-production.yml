name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          version: 2026.8.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    # GitHub Environment `production` requires approval by jmondragontech2023
    # and deployment branches restricted to main (configured in repo settings).
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          version: 2026.8.14
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker (production)
        run: pnpm --filter @ridevector/api run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Post-deploy health smoke
        run: |
          set -euo pipefail
          url="https://ridevector-api-production.jmondragontech.workers.dev/api/health"
          for i in 1 2 3 4 5; do
            body="$(curl -fsS "$url" || true)"
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q 'ridevector-api'; then
              echo "Production health OK: $body"
              exit 0
            fi
            echo "Attempt $i failed: $body"
            sleep 3
          done
          echo "Production health smoke failed"
          exit 1
